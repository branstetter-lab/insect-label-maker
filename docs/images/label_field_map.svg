<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Collection label field map</title>
<desc id="desc">Six collection text lines on the left, a Data Matrix encoding Catalog_Number at right, a vertical Catalog_Number and a Field_Number below the matrix. An optional separate habitat label contains macrohabitat, microhabitat and sampling protocol.</desc>
<rect width="900" height="430" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172b3a">
<text x="20" y="25" font-size="18" font-weight="bold">Field names — explanatory diagram, not a print template</text>
<rect x="20" y="42" width="860" height="235" rx="3" fill="#f8fafc" stroke="#64748b"/>
<g font-size="16">
<text x="38" y="76">[Country]: [StateProv], [County]</text>
<text x="38" y="109">[LocalityLabel]</text>
<text x="38" y="142">[Latitude] [Longitude]±[Uncertainty]m</text>
<text x="38" y="175">[Verbatim_Elevation], [Verbatim_Date]</text>
<text x="38" y="208">[Collector_Label]</text>
<text x="38" y="241">[MacroHabitat_Label]; [Microhabitat_Label]</text>
</g>
<rect x="622" y="68" width="188" height="151" fill="white" stroke="#64748b" stroke-dasharray="4 4"/>
<text x="716" y="108" font-size="16" text-anchor="middle">Data Matrix</text>
<text x="716" y="137" font-size="14" text-anchor="middle">encodes</text>
<text x="716" y="166" font-size="16" text-anchor="middle">[Catalog_Number]</text>
<text x="716" y="199" font-size="12" text-anchor="middle">clear white margin</text>
<text x="850" y="158" font-size="16" text-anchor="middle" transform="rotate(-90 850 158)">[Catalog_Number]</text>
<text x="716" y="250" font-size="16" text-anchor="middle">[Field_Number]</text>
<text x="20" y="305" font-size="15">With --separate-habitat, move habitat text off the main label:</text>
<rect x="20" y="318" width="535" height="98" rx="3" fill="#f8fafc" stroke="#64748b"/>
<text x="38" y="344" font-size="16">[MacroHabitat_Label]</text>
<text x="38" y="373" font-size="16">[Microhabitat_Label]</text>
<text x="38" y="402" font-size="16">[Sampling_Protocol] (optional: --include-method)</text>
<text x="580" y="348" font-size="13">StateProvince is also accepted.</text>
<text x="580" y="374" font-size="13">Diagram spacing is illustrative.</text>
<text x="580" y="400" font-size="13">Use the example PDFs to assess actual size.</text>
</g></svg>